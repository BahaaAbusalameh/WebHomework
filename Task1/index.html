<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 1</title>
    <style>
        body{
            margin: 0;
            font-family: Arial, sans-serif;
        }
        nav{
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background-color: #0e13a270;
        }
        .logo{
            color : white;
            font-size: 30px;
            font-weight: bold;
    
        }
        .logo img{
            width: 100px;
            height: 70px;
        }
        nav ul{
            list-style: none;
            gap : 20px;
            display: flex;
            margin: 0;
            padding: 0;
        }
        nav ul li a{
            text-decoration:  none;
            color: white;
            font-size: 20px;
        }
        nav ul li a:hover{
            color : #0e13a2;
        }
        
    </style>
</head>
<body>
   <nav>
    <div class="logo"><img src="/BahaaLogo.png" alt=""></div>
    <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Services</a></li>
        <li><a href="#">Contact</a></li>
    </ul>
   </nav>
</body>
</html>
