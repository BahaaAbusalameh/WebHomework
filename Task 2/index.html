<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 2</title>
    <style>
        .gallery{
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            padding: 20px;
        }
        .card{
            background-color: rgb(149, 116, 211);
            color : white;
            padding: 40px;
            text-align: center;
            font-size: 30px;
            border-radius: 10px;
            font-family: Arial, sans-serif;
        }
        .card:first-child{
            grid-column: span 2;
        }
        .card img{
            width: 100%;
            height: auto;
        }
      
    </style>
</head>
<body>
<div class="gallery">
    <div class="card"><img src="https://picsum.photos/400/200" alt=""></div>
    <div class="card"><img src="https://picsum.photos/300/200" alt=""></div>
    <div class="card"><img src="https://picsum.photos/300/201" alt=""></div>
    <div class="card"><img src="https://picsum.photos/300/202" alt=""></div>
    <div class="card"><img src="https://picsum.photos/300/203" alt=""></div>
    <div class="card"><img src="https://picsum.photos/300/204" alt=""></div>
    </div>
</body>
</html>
